<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Задачи</title>
  
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-brand">
      <img src="assets/ballerina_clean.png" alt="Logo" class="brand-icon">
      <span class="brand-title">Задачи</span>
    </div>

    <div class="header-info">
      <span id="activeCountBadge" class="active-count-badge">0 активных</span>
    </div>
  </header>

  <!-- Container -->
  <main class="app-container">

    <!-- Task Creator -->
    <section class="task-creator">
      <form id="taskForm" autocomplete="off">
        <div class="creator-main-row">
          <input 
            type="text" 
            id="taskInput" 
            class="task-main-input" 
            placeholder="Что нужно сделать?" 
            required 
            autofocus
          >
          <button type="submit" class="btn-add">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>Добавить</span>
          </button>
        </div>

        <div class="creator-meta-row">
          <div class="creator-selectors">
            <div class="selector-item">
              <select id="prioritySelect" class="meta-select" aria-label="Приоритет">
                <option value="none">Без приоритета</option>
                <option value="low">Низкий</option>
                <option value="med" selected>Средний</option>
                <option value="high">Высокий</option>
              </select>
            </div>

            <div class="selector-item">
              <select id="categorySelect" class="meta-select" aria-label="Категория">
                <option value="none">Без категории</option>
                <option value="Работа" selected>Работа</option>
                <option value="Личное">Личное</option>
                <option value="Проект">Проект</option>
                <option value="Учеба">Учеба</option>
              </select>
            </div>

            <div class="selector-item">
              <input type="date" id="dueDateInput" class="date-input" aria-label="Срок выполнения">
            </div>
          </div>
        </div>
      </form>
    </section>

    <!-- Toolbar -->
    <section class="toolbar">
      <div class="filter-tabs">
        <button type="button" class="tab-btn active" id="tabAll">
          Все <span class="tab-count" id="countAll">0</span>
        </button>
        <button type="button" class="tab-btn" id="tabPending">
          Активные <span class="tab-count" id="countPending">0</span>
        </button>
        <button type="button" class="tab-btn" id="tabCompleted">
          Завершенные <span class="tab-count" id="countCompleted">0</span>
        </button>
      </div>

      <div class="search-box">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск..." aria-label="Поиск задач">
      </div>
    </section>

    <!-- Task List -->
    <section id="taskList" class="task-list"></section>

    <!-- Empty Box -->
    <div id="emptyBox" class="empty-box" style="display: none;">
      <div class="empty-title">Задач не найдено</div>
      <div class="empty-desc">Добавьте новую задачу с помощью поля выше</div>
    </div>

    <!-- Footer -->
    <footer class="list-footer">
      <span id="remainingSummary">Осталось задач: 0</span>
      <button type="button" id="clearCompletedBtn" class="btn-clear">Очистить завершенные</button>
    </footer>

  </main>

  <!-- Toast -->
  <div id="toastWrap" class="toast-wrap" aria-live="polite"></div>

  <!-- App script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
